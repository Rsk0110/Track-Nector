services:
  - type: web
    name: ledger-co
    runtime: python
    plan: starter
    buildCommand: python -m py_compile bank_account.py
    startCommand: gunicorn bank_account:app
    healthCheckPath: /api/accounts
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LEDGER_DATA_FILE
        value: /var/data/accounts.json
    disk:
      name: ledger-data
      mountPath: /var/data
      sizeGB: 1
